<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mein Rezeptbuch - Rezepte verwalten und ansehen"
    />
    <title>Mein Rezeptbuch</title>
  </head>
  <body>
    <header>
      <h1>Mein Rezeptbuch</h1>
    </header>
    <main>
      <section>
        <p>
          Willkommen zu meinem Rezeptbuch! Hier können Sie Ihre Lieblingsrezepte
          speichern, verwalten und jederzeit darauf zugreifen.
        </p>
        <p>Fügen Sie ein neues Rezept hinzu:</p>
        <p>
          Backen - Kuchen, Torten, Desserts & Nachspeisen<br />Kochen -
          Herzhafte Gerichte, Beilagen, Suppen & mehr
        </p>
        <article>
          <button type="button" data-category="cooking" class="category-btn cooking-btn">Kochen</button>
          <button type="button" data-category="baking" class="category-btn baking-btn">Backen</button>
        </article>
        <div
          id="form-container"
          class="hidden"
          aria-live="polite"
          aria-hidden="true"
        >
          <div class="form-header">
            <div class="form-actions">
              <button
                type="button"
                id="reset-form"
                class="secondary-btn"
                aria-label="Formular zurücksetzen"
              >
                Zurücksetzen
              </button>
              <button
                type="button"
                id="close-form"
                aria-label="Formular schließen"
              >
                ✕
              </button>
            </div>
            <h2 id="form-title">Rezept hinzufügen</h2>
            
          </div>

          <form id="recipe-form">
            <label for="recipe-name">Rezeptname:</label>
            <input type="text" id="recipe-name" name="recipe-name" required />

            <label for="recipe-time">Zubereitungszeit (Minuten):</label>
            <input type="number" id="recipe-time" name="recipe-time" min="0" />

            <div id="category-fields"></div>

            <label for="recipe-ingredients">Zutaten:</label>
            <textarea
              id="recipe-ingredients"
              name="recipe-ingredients"
              required
            ></textarea>

            <label for="recipe-instructions">Zubereitung:</label>
            <textarea
              id="recipe-instructions"
              name="recipe-instructions"
              required
            ></textarea>

            <label for="recipe-image">Rezeptbild:</label>
            <input
              type="file"
              id="recipe-image"
              name="recipe-image"
              accept="image/*"
            />

            <button type="submit">Rezept speichern</button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
